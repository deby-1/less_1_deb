name: Classroom CI-CD Demo 2026


on:
  push:
    branches: [ main ]

jobs:

  build_stage:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: chat-application/package-lock.json

      - name: Install Dependenciess
        run: npm ci
        working-directory: ./chat-application

      - name: Build Application
        run: npm run build
        working-directory: ./chat-application


  test_stage:
    needs: build_stage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: chat-application/package-lock.json

      - name: Install Dependencies
        run: npm ci
        working-directory: ./chat-application

      - name: Run Tests
        run: npm test
        working-directory: ./chat-application

  deploy_stage:
    needs: test_stage
    runs-on: ubuntu-latest

    steps:
      - name: Simulate Deploy
        run: |
          echo "=== STARTING DEPLOY STAGE ==="
          echo "Deploying the artifact to Staging environment..."
          echo "Deployment completed! App is live."
